[project]
name = "llm-inference-platform"
version = "0.1.0"
description = "Production-style LLM inference platform: raw Transformers -> vLLM, measured at every step"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the model downloaded and loaded (deselect with '-m \"not slow\"')",
]
